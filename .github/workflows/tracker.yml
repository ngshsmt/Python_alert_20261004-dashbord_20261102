name: Position Tracker Trigger_v.1.0.1

on:
  schedule:
    # 9:37 JST (= 00:37 UTC), 11:37 JST (= 02:37 UTC), 15:37 JST (= 06:37 UTC)
    - cron: '37 0 * * 1-5'
    - cron: '37 2 * * 1-5'
    - cron: '37 6 * * 1-5'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-tracker]

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
       - name: Create service_account.json from Secret
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python -c 'import os; open("service_account.json", "w", encoding="utf-8").write(os.environ["GCP_SA_KEY"])
      - name: Run Tracker Script
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SHEET_NAME: 'シート1(GAS連携中)'
          SERVICE_ACCOUNT_FILE: 'service_account.json'
        run: |
          python tracker.py
      - name: Clean up credential file
        if: always()
        run: |
          rm -f service_account.json
