# .github/workflows/screener.yml
# GitHub Actions ワークフロー設定
name: Stock Screener & Signal Alert

on:
  schedule:
    # 毎日 15:35 JST に実行 (UTC基準では 06:35 UTC)
    # 平日（月〜金）のみ実行: cron '35 6 * * 1-5'
    - cron: '35 6 * * 1-5'
  workflow_dispatch: # GitHubの画面から手動実行できるようにする設定

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests
          pip install git+https://github.com/twopirllc/pandas-ta.git

      - name: Run screener script
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python screener.py
