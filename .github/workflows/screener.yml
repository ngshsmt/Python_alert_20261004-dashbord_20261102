# .github/workflows/screener.yml
# GitHub Actions ワークフロー_v.1.0.3
# cronだと遅延するため外部Webフック起動への切替

name: Stock Screener & Signal Alert

on:
  # 自動実行(20261010停止)
#  schedule:
#    # 予備のcron（15:35 JST = 06:35 UTC）
#    - cron: '35 6 * * 1-5'
  # 手動実行
  workflow_dispatch:
  # 外部サービスで実行
  repository_dispatch:
    types: [trigger-screener]

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests numpy

      - name: Run screener script
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python screener.py
